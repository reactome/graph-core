name: graph-core

# Built, packaged and its shipped dependencies' licences checked (the parent's allowlist) on each
# pull request and push. Its tests need a Neo4j graph of Reactome's data and are not run here
# yet: that is the next step, against a fixture graph. On a version tag (v*), signed and
# uploaded to Maven Central through Sonatype's Central Portal, and published as soon as Central
# validates it (autoPublish, from reactome-parent); the publish job runs in the `maven-central`
# environment, so GitHub asks a person to approve it before anything is uploaded, and the
# Sonatype token and the signing key are that environment's secrets.

on:
    pull_request:
    push:
        branches: [main]
        tags: ['v*']

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
              with:
                  distribution: temurin
                  java-version: '17'
                  cache: maven
            # Reactome's own POMs come from Maven Central, never from the cache: an earlier run
            # built reactome-parent from its branch into ~/.m2, and the cache would keep serving it.
            - name: Reactome's POMs fetched from Central, not the cache
              run: rm -rf ~/.m2/repository/org/reactome/maven
            # graph-core's POM on Central is there for good, and its repositories with it. EBI's
            # Nexus is going away, so it names none: everything comes from Central.
            - name: The POM names no repository of its own
              run: "! grep -nE '<(repositories|pluginRepositories|distributionManagement)>|ebi\\.ac\\.uk/Tools/maven' pom.xml"
            # A release publishes itself once Central validates it, and the deploy waits until it is
            # live, so one that fails to publish fails (reactome-parent 1.0.8 and later).
            - name: A release publishes itself, and waits until it is live
              run: |
                  mvn -B -ntp -q -Dsonatype-deploy=true help:effective-pom -Doutput="$RUNNER_TEMP/deploy.xml"
                  grep -q '<autoPublish>true</autoPublish>' "$RUNNER_TEMP/deploy.xml"
                  grep -q '<waitUntil>published</waitUntil>' "$RUNNER_TEMP/deploy.xml"
            - name: Built, tested where no graph is needed, packaged, licences checked
              # Every test is compiled, linted and woven; only those that need no Reactome graph run.
              run: mvn -B -ntp -Dgpg.skip -Dtest=ReflectionUtilsTest -Dsurefire.failIfNoSpecifiedTests=false verify
            - name: A build without clean weaves nothing twice
              # AspectJ once wove target/classes and target/test-classes in place, so a second
              # build wove its own output: advised methods gained a second closure, and their
              # advice ran twice.
              run: |
                  main() { find target/classes -name '*AjcClosure*.class' | wc -l; }
                  tests() { find target/test-classes -name '*AjcClosure*.class' | wc -l; }
                  before="$(main) $(tests)"
                  mvn -B -ntp -o -Dgpg.skip -DskipTests package
                  after="$(main) $(tests)"
                  echo "AjcClosure classes (main, test): $before after the first build, $after after the second"
                  test "$(main)" -gt 0
                  test "$before" = "$after"

    publish:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: build
        runs-on: ubuntu-latest
        environment: maven-central
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            # A version on Central is there for good: only a commit on main, tagged with the
            # POM's own version (so never a SNAPSHOT), is published.
            - name: The tag is on main and names graph-core's version
              run: |
                  git merge-base --is-ancestor "$GITHUB_SHA" origin/main
                  version=$(sed -n '0,/<artifactId>graph-core<\/artifactId>/d; s:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)
                  test "$GITHUB_REF_NAME" = "v$version"
                  case "$version" in *-SNAPSHOT) echo "a SNAPSHOT is never published"; exit 1 ;; esac
            - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
              with:
                  distribution: temurin
                  java-version: '17'
                  server-id: central
                  server-username-env-var: MAVEN_CENTRAL_USERNAME
                  server-password-env-var: MAVEN_CENTRAL_PASSWORD
                  gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
                  gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
            - name: Signed, uploaded to the Central Portal, and published once validated
              env:
                  MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
                  MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
                  MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
              run: mvn -B -ntp -Dsonatype-deploy=true -Dmaven.test.skip=true deploy
